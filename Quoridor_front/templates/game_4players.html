<!DOCTYPE html>
<html>

<head>
    <title>Quoridor - 4 Joueurs</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <script>
        const isVsAI = false;
        window.GAME_MODE = "4players";
    </script>

</head>

<div id="game-over-popup" class="popup hidden">
    <div class="popup-content">
        <h2 id="winner-text"></h2>
        <button id="restart-btn2">Rejouer</button>
    </div>
</div>


<body>
    <div id="error-message" class="error hidden"></div>

    <div class="container">
        <div class="left-section">

            <h1>Quoridor - 4 Joueurs</h1>

            <div class="game-container">
                <!-- Joueur 2 (haut) -->
                <div class="player player-1 top-player">
                    <h3>Joueur 1</h3>
                    <div class="walls-count">Murs: <span id="player1-walls">5</span></div>
                </div>

                <div class="middle-section">
                    <!-- Joueur 3 (gauche) -->
                    <div class="player player-3 left-player">
                        <h3>Joueur 3</h3>
                        <div class="walls-count">Murs: <span id="player3-walls">5</span></div>
                    </div>

                    <!-- Plateau de jeu -->
                    <div class="game-board" id="game-board"></div>

                    <!-- Joueur 4 (droite) -->
                    <div class="player player-4 right-player">
                        <h3>Joueur 4</h3>
                        <div class="walls-count">Murs: <span id="player4-walls">5</span></div>
                    </div>
                </div>

                <!-- Joueur 1 (bas) -->
                <div class="player player-2 bottom-player">
                    <h3>Joueur 2</h3>
                    <div class="walls-count">Murs: <span id="player2-walls">5</span></div>
                </div>
            </div>

            <div class="game-status" id="game-status"></div>
        </div>

        <div class="right-section">
            <div class="controls">
                <button id="restart-btn" class="welcome-btn">Nouvelle partie</button>
                <button id="rules-btn" class="welcome-btn">Règles</button>
                <button id="stop-btn" class="welcome-btn">Arrêter</button>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
function fitToScreen() {
  const container = document.querySelector('.container');
  container.style.transform = 'scale(1)'; // reset scale

  const scaleX = window.innerWidth / container.scrollWidth;
  const scaleY = window.innerHeight / container.scrollHeight;
  const scale = Math.min(scaleX, scaleY);

  container.style.transform = `scale(${scale})`;
}

window.addEventListener('load', fitToScreen);
window.addEventListener('resize', fitToScreen);
</script>

</body>

</html>
